[package]
name = "reference-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
reference-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[features]
default = []
cuda = ["reference-core/cuda"]
metal = ["reference-core/metal"]
