<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reference</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="drag-region" data-tauri-drag-region></div>
    <main class="panel">
      <div class="search-bar">
        <input
          id="search-input"
          placeholder="search your files — ⌘7 to add a folder"
          autofocus
          autocomplete="off"
        />
        <button id="scope-btn" class="scope-btn" type="button" title="scope search to a folder">
          <span id="scope-label">All folders</span>
        </button>
        <button id="copy-all-btn" class="copy-all-btn" title="copy all results" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>
      <ul id="results"></ul>
    </main>
  </body>
</html>
